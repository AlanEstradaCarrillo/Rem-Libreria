name: Pruebas POS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    name: Integración con PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: libra_ci
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: libra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libra_ci -d libra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Valores desechables del servicio aislado de CI; nunca credenciales reales.
      DATABASE_URL: postgresql://libra_ci:ci_only_not_a_secret@127.0.0.1:5432/libra_ci
      PGSSL: "0"
      JWT_SECRET: ci_only_integration_token_not_for_any_real_environment_2026
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias limpias
        run: npm ci
      - name: Ejecutar pruebas completas
        run: npm test
